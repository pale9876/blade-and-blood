name: Deploy Rust Application
on:
  push:
    branches:
        - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t aaasssss231/blade-and-blood .
      - name: Push Image to docker hub
        run: docker push aaasssss231/blade-and-blood:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:  
      - name: Pull image from docker hub
        run: docker pull aaasssss231/blade-and-blood:latest
      - name: Delete old container
        run: docker rm -f blade-and-blood-container  
      - name: Run docker container
        run: docker run -d -p 3000:3000 --name blade-and-blood-container -e MONGO_USER='${{ secrets.MONGO_USER }}' -e MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}' -e MONGO_HOST='${{ secrets.MONGO_HOST }}' -e MONGO_DB='${{ secrets.MONGO_DB }}' aaasssss231/blade-and-blood