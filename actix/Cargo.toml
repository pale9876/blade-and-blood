[package]
name = "bnb-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0.1"
actix-session = {version = "0.11.0", features = ["redis-session"]}
actix-identity = "0.9.0"
actix-ws = "0.4.1"

mongodb = "2.5.0" # DB

validator = { version = "0.16", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3"

dotenv = "0.15"  
log = "0.4"      
env_logger = "0.9"

argon2 = "0.5.3"
dyf = "0.2.2"
clap = { version = "4.6.9", features = ["derive"] }
